[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
app = "app:main"

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.basedpyright]
typeCheckingMode = "standard"
